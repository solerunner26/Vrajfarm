<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<title>અંગત હિસાબ</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f1d163bd7079433bcc1afa0784b5089f">
<script src="/_blob/a577eb47629646d782fd5a8c0182f8dd"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="vk" data-vk-theme="{{th}}" style="width: 360px; height: 1120px;">
  <header class="vk-hdr" style="padding-bottom: 36px;">
    <svg class="vk-orn" width="360" height="200" viewBox="0 0 360 200" aria-hidden="true"><g><path d="M0 150 Q180 112 360 148"></path><path d="M0 168 Q180 130 360 166"></path><circle cx="310" cy="50" r="40"></circle></g></svg>
    <div class="vk-bar">
      <a href="Main.dc.html" class="vk-hbtn" aria-label="પાછા"><svg width="24" height="24" viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 class="vk-h1">અંગત / ઘર હિસાબ</h1>
    </div>
    <div class="vk-grid2">
      <div><div style="font-size: 13px; opacity: 0.85;">આવક · નવેમ્બર</div><div style="font-size: 26px; font-weight: 800; white-space: nowrap;">₹35,000</div></div>
      <div><div style="font-size: 13px; opacity: 0.85;">ખર્ચ · નવેમ્બર</div><div style="font-size: 26px; font-weight: 800; white-space: nowrap;">₹21,300</div></div>
    </div>
    <svg class="vk-toran" width="360" height="18" viewBox="0 0 360 18" preserveAspectRatio="none" aria-hidden="true"><path d="M0 18V10Q15 0 30 10T60 10T90 10T120 10T150 10T180 10T210 10T240 10T270 10T300 10T330 10T360 10V18Z"></path></svg>
  </header>

  <div class="vk-body">
    <div class="vk-info"><img src="{{ic.lock}}" alt="" style="width: 26px; height: 26px; flex: none;"><span>આ ખાતું ખેતીના નફા-નુકસાનથી સંપૂર્ણ અલગ છે.</span></div>

    <section class="vk-card">
      <h2 style="margin: 0; font-size: 18px; font-weight: 800;">ખર્ચ ક્યાં થયો?</h2>
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="display: flex; justify-content: space-between; font-size: 15px;"><span>{{c.name}}</span><span style="font-weight: 800;">{{c.amt}}</span></div>
          <div class="vk-track" style="height: 10px;"><div class="vk-fill" style="{{c.bar}}"></div></div>
        </div>
      </sc-for>
    </section>

    <div class="vk-sec"><svg class="vk-leaf" width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path class="a" d="M10 13C4 13 1 9 1 3c5 0 9 3 9 10z"></path><path class="b" d="M10 13c0-6 3-10 9-10 0 6-3 10-9 10z"></path></svg><h2>તાજેતરની એન્ટ્રી</h2><span class="ln"></span></div>
    <div class="vk-card flush">
      <div class="vk-row"><img class="ic" src="{{ic.income}}" alt=""><span class="vk-row-main"><span class="vk-t">ભાડાની આવક</span><span class="vk-m">01-11-2026</span></span><span class="vk-amt in">+₹35,000</span></div>
      <div class="vk-row"><img class="ic" src="{{ic.expense}}" alt=""><span class="vk-row-main"><span class="vk-t">દિવાળી ખરીદી</span><span class="vk-m">02-11-2026</span></span><span class="vk-amt">−₹4,600</span></div>
      <div class="vk-row"><img class="ic" src="{{ic.expense}}" alt=""><span class="vk-row-main"><span class="vk-t">શાળા ફી</span><span class="vk-m">30-10-2026</span></span><span class="vk-amt">−₹5,500</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["green","mati","akash","kesar","night"],"default":"green"},"$preview":{"width":360,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const th = this.props.theme ?? 'green';
    const cats = [['કરિયાણું', 8200], ['શિક્ષણ', 5500], ['તહેવાર', 4600], ['દવા', 3000]].map(([name, v]) => ({
      name, amt: '₹' + v.toLocaleString('en-IN'), bar: 'height: 10px; width: ' + Math.round((v / 8200) * 100) + '%;',
    }));
    return { th, ic: (window.VK_ICONS || {})[th] || {}, cats };
  }
}
</script>
</body>
</html>
