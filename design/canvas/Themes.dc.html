<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<title>5 થીમ સરખામણી</title>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800&amp;family=Baloo+Bhai+2:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 2040px; height: 2120px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 28px; background: #E9ECEA; font-family: 'Noto Sans Gujarati', sans-serif; color: #17201B;">
  <div style="display: flex; align-items: baseline; gap: 16px;">
    <h1 style="margin: 0; font-size: 34px; font-weight: 800;">5 થીમ · એક જ ડિઝાઇન</h1>
    <span style="font-size: 18px; color: #46534C;">Every screen, control, icon and widget switches with the theme. Pick it in Settings › થીમ.</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(5, 360px); gap: 40px;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 20px; font-weight: 800;">વ્રજ લીલો · Vraj Green</span>
      <dc-import name="Main" theme="green" hint-size="360px,1960px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 20px; font-weight: 800;">માટી · Terracotta</span>
      <dc-import name="Main" theme="mati" hint-size="360px,1960px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 20px; font-weight: 800;">આકાશ · Indigo Sky</span>
      <dc-import name="Main" theme="akash" hint-size="360px,1960px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 20px; font-weight: 800;">કેસર · Saffron</span>
      <dc-import name="Main" theme="kesar" hint-size="360px,1960px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 20px; font-weight: 800;">રાત્રિ · Night (dark)</span>
      <dc-import name="Main" theme="night" hint-size="360px,1960px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2040,"height":2120}}'>
