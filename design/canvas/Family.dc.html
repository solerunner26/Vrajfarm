<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<title>પરિવાર ઉપાડ ખાતું</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f1d163bd7079433bcc1afa0784b5089f">
<script src="/_blob/a577eb47629646d782fd5a8c0182f8dd"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="vk" data-vk-theme="{{th}}" style="width: 360px; height: 1220px;">
  <header class="vk-hdr">
    <svg class="vk-orn" width="360" height="110" viewBox="0 0 360 110" aria-hidden="true"><g><path d="M0 84 Q180 50 360 82"></path><path d="M0 100 Q180 66 360 98"></path><circle cx="320" cy="20" r="34"></circle></g></svg>
    <div class="vk-bar">
      <a href="Main.dc.html" class="vk-hbtn" aria-label="પાછા"><svg width="24" height="24" viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 class="vk-h1">ઉપાડ ખાતું</h1>
    </div>
    <svg class="vk-toran" width="360" height="18" viewBox="0 0 360 18" preserveAspectRatio="none" aria-hidden="true"><path d="M0 18V10Q15 0 30 10T60 10T90 10T120 10T150 10T180 10T210 10T240 10T270 10T300 10T330 10T360 10V18Z"></path></svg>
  </header>

  <div class="vk-body">
    <div class="vk-seg" role="group" aria-label="પરિવાર">
      <button onClick="{{pickA}}" class="{{aCls}}">પરિવાર A</button>
      <button onClick="{{pickB}}" class="{{bCls}}">પરિવાર B</button>
    </div>

    <section class="vk-card">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span class="vk-avatar" style="width: 56px; height: 56px; font-size: 22px;">{{initial}}</span>
        <span class="vk-row-main"><span class="vk-t" style="font-size: 20px; font-weight: 800;">{{name}}</span><span class="vk-m" style="font-size: 14px;">{{phone}}</span></span>
      </div>
      <div class="vk-grid2" style="gap: 10px;">
        <div class="vk-stat"><div class="k">નવેમ્બર ઉપાડ</div><div class="v" style="color: var(--p);">{{month}}</div></div>
        <div class="vk-stat"><div class="k">વર્ષ 2026 કુલ</div><div class="v">{{year}}</div></div>
      </div>
    </section>

    <div class="vk-sec"><svg class="vk-leaf" width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path class="a" d="M10 13C4 13 1 9 1 3c5 0 9 3 9 10z"></path><path class="b" d="M10 13c0-6 3-10 9-10 0 6-3 10-9 10z"></path></svg><h2>આ મહિનાનો ઉપાડ</h2><span class="ln"></span></div>
    <div class="vk-card flush">
      <sc-for list="{{entries}}" as="e" hint-placeholder-count="3">
        <div class="vk-row">
          <span class="vk-row-main"><span class="vk-t">{{e.note}}</span><span class="vk-m">{{e.date}}</span></span>
          <span class="vk-amt">{{e.amt}}</span>
        </div>
      </sc-for>
    </div>

    <section class="vk-card" style="gap: 10px;">
      <span class="vk-label">WhatsApp મેસેજ પૂર્વાવલોકન</span>
      <div class="vk-bubble">{{receipt}}</div>
    </section>

    <button class="vk-btn lg filled"><img src="{{ic.message}}" alt="">WhatsApp પાવતી મોકલો</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["green","mati","akash","kesar","night"],"default":"green"},"$preview":{"width":360,"height":1220}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { fam: 'A' }; }
  renderVals() {
    const th = this.props.theme ?? 'green';
    const A = this.state.fam === 'A';
    const data = A
      ? { initial: 'A', name: 'પરિવાર A', phone: '+91 [મોબાઇલ નંબર]', month: '₹12,000', year: '₹96,500',
          entries: [{ note: 'રોકડ ઉપાડ', date: '31-10-2026 · આસો વદ છઠ', amt: '₹5,000' }, { note: 'દવાખાના માટે', date: '24-10-2026 · આસો સુદ ચૌદશ', amt: '₹4,000' }, { note: 'કરિયાણું', date: '18-10-2026 · આસો સુદ આઠમ', amt: '₹3,000' }] }
      : { initial: 'B', name: 'પરિવાર B', phone: '+91 [મોબાઇલ નંબર]', month: '₹8,500', year: '₹71,200',
          entries: [{ note: 'રોકડ ઉપાડ', date: '30-10-2026 · આસો વદ પાંચમ', amt: '₹5,000' }, { note: 'બાળકોની ફી', date: '20-10-2026 · આસો સુદ દસમ', amt: '₹3,500' }] };
    data.receipt = 'નમસ્તે ' + data.name + ',\nનવેમ્બર 2026 નો ઉપાડ: ' + data.month + '\nવર્ષ 2026 કુલ: ' + data.year + '\n— વ્રજ ખેતી હિસાબ, થોરાળા';
    return { ...data, th, ic: (window.VK_ICONS || {})[th] || {},
      aCls: A ? 'on' : '', bCls: !A ? 'on' : '',
      pickA: () => this.setState({ fam: 'A' }), pickB: () => this.setState({ fam: 'B' }) };
  }
}
</script>
</body>
</html>
