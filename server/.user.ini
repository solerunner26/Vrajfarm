; Vraj Kheti Hisab — PHP limits for the backup receiver folder.
; Install as: /home/<cpanel-user>/public_html/vraj/.user.ini
; (cPanel -> MultiPHP INI Editor can set the same values instead.)
; Changes can take up to 5 minutes to apply (user_ini.cache_ttl).
file_uploads = On
upload_max_filesize = 200M
post_max_size = 210M
max_execution_time = 300
max_input_time = 300
memory_limit = 128M
display_errors = Off
log_errors = On
